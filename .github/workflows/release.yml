name: Release to PyPI

# Every push to main releases a patch version, but only after CI passes.
# Run it by hand with dry_run (the default) to build and check the release
# without bumping, tagging or publishing.
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and check only; don't bump, tag or publish"
        type: boolean
        default: true

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    if: "!contains(github.event.head_commit.message, 'ci: bump version')"
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine bumpver toml

      - name: Bump version
        run: bumpver update --patch --no-commit

      - name: Get version
        id: version
        run: |
          VERSION=$(python -c "import toml; print(toml.load('pyproject.toml')['project']['version'])")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Release version: $VERSION (dry run: $DRY_RUN)"

      - name: Build package
        run: |
          python -m build
          twine check dist/*

      - name: Publish to PyPI
        if: env.DRY_RUN != 'true'
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload dist/*

      # Commit and tag only after the upload succeeded, so a failed publish
      # doesn't leave a version on main that was never released.
      - name: Commit and tag
        if: env.DRY_RUN != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml
          git commit -m "ci: bump version ${{ steps.version.outputs.version }}"
          git tag "v${{ steps.version.outputs.version }}"
          git push
          git push --tags
