name: Release to PyPI

# Every push to main releases a patch version, but only after CI passes.
# Run it by hand with dry_run (the default) to build and check the release
# without bumping, tagging or publishing.
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and check only; don't bump, tag or publish"
        type: boolean
        default: true

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      # The next version is one patch above what PyPI already has. It is set in
      # the build only and recorded as a tag: nothing is pushed to main, which
      # is protected. pyproject.toml's version on main is not the source of truth.
      - name: Next version
        id: version
        run: |
          NAME=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['name'])")
          LATEST=$(curl -sf "https://pypi.org/pypi/${NAME}/json" | python -c "import json,sys; print(json.load(sys.stdin)['info']['version'])" || echo "0.0.0")
          VERSION=$(python -c "v='${LATEST}'.split('.'); v=[int(x) for x in v[:3]]+[0]*(3-len(v[:3])); v[2]+=1; print('.'.join(map(str,v)))")
          python -c "import re,sys; p='pyproject.toml'; s=open(p).read(); s,n=re.subn(r'(?m)^version = \"[^\"]*\"', 'version = \"${VERSION}\"', s, count=1); assert n==1, 'no version line'; open(p,'w').write(s)"
          grep -m1 '^version' pyproject.toml
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Release version: $VERSION (PyPI had $LATEST, dry run: $DRY_RUN)"

      - name: Build package
        run: |
          python -m build
          twine check dist/*

      - name: Publish to PyPI
        if: env.DRY_RUN != 'true'
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload dist/*

      # Tag only after the upload succeeded, so a failed publish leaves no tag
      # for a version that was never released. Only the tag is pushed.
      - name: Tag
        if: env.DRY_RUN != 'true'
        run: |
          git tag "v${{ steps.version.outputs.version }}" "${{ github.sha }}"
          git push origin "v${{ steps.version.outputs.version }}"
